name: Build Bazarek

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web_market/package-lock.json
      - name: Install dependencies
        working-directory: web_market
        run: npm ci
      - name: Test
        working-directory: web_market
        run: npm test
      - name: Build
        working-directory: web_market
        run: npm run build
