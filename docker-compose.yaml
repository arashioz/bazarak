services:
  bazarek:
    build:
      context: ./web_market
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      MONGODB_URI: mongodb://mongo:27017/bazarek
      MONGODB_DB: bazarek
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped

  mongo:
    image: mongo:7
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  mongo-data:
    # Keep MongoDB data independent from the Compose lifecycle. In particular,
    # `docker compose down -v` must not delete customer/catalog data.
    external: true
    name: bazarak_mongo-data
