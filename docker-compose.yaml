services:
  bazarek:
    build:
      context: ./web_market
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      MONGODB_URI: mongodb://mongo:27017/bazarek
      MONGODB_DB: bazarek
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped

  bazarek-map:
    build:
      context: ./bazarak-map
      dockerfile: Dockerfile
    ports:
      - "3001:3000"
    environment:
      # Intentionally identical to bazarek: the map reads/writes appState in
      # the primary database, not a second database.
      MONGODB_URI: mongodb://mongo:27017/bazarek
      MONGODB_DB: bazarek
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped

  migrate:
    # A one-shot tool. It has access to legacy source files only while importing
    # them, and is never started as part of the application.
    profiles: ["tools"]
    build:
      context: ./web_market
      dockerfile: Dockerfile
      target: build
    command: node scripts/migrate-sources-to-mongo.mjs
    environment:
      MONGODB_URI: mongodb://mongo:27017/bazarek
      MONGODB_DB: bazarek
    depends_on:
      mongo:
        condition: service_healthy

  mongo:
    image: mongo:7
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  mongo-data:
    # Keep MongoDB data independent from the Compose lifecycle. In particular,
    # `docker compose down -v` must not delete customer/catalog data.
    external: true
    name: bazarak_mongo-data
