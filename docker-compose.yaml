services:
  bazarek:
    build:
      context: ./web_market
      dockerfile: Dockerfile
      args:
        NODE_IMAGE: ${NODE_IMAGE:-mirror.gcr.io/library/node:20-alpine}
    ports:
      - "3000:3000"
    environment:
      MONGODB_URI: mongodb://mongo:27017/bazarek
      MONGODB_DB: bazarek
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped

  mongo:
    image: ${MONGO_IMAGE:-mirror.gcr.io/library/mongo:7}
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  mongo-data:
